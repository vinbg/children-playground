[project]
name = "ib-mcp-server"
version = "1.0.0"
description = "MCP Server for Interactive Brokers Portfolio Tracking"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    # MCP SDK
    "mcp>=1.0.0",

    # Interactive Brokers
    "ib-async>=1.0.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "cachetools>=5.3.0",
]

[project.scripts]
ib-mcp-server = "ib_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ib_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"
