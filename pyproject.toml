[project]
name = "ib-mcp-server"
version = "1.0.0"
description = "MCP Server for Interactive Brokers Portfolio Tracking, News & Sentiment Analysis"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    # MCP SDK
    "mcp>=1.0.0",

    # Interactive Brokers
    "ib-async>=1.0.0",

    # News APIs
    "finnhub-python>=2.4.0",
    "alpha-vantage>=2.3.1",

    # Sentiment Analysis
    "transformers>=4.35.0",
    "torch>=2.0.0",
    "nltk>=3.8.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "aiohttp>=3.9.0",
    "cachetools>=5.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
    "ruff>=0.1.0",
]

[project.scripts]
ib-mcp-server = "ib_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ib_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
